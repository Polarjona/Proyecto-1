<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33455F"/>
      <stop offset="0.55" stop-color="#40556E"/>
      <stop offset="1" stop-color="#5C6A7C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9C878"/>
      <stop offset="1" stop-color="#C89A4A"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#F3DDB0"/>
      <stop offset="0.6" stop-color="#E8C489"/>
      <stop offset="1" stop-color="#D6A263"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="128" height="128" rx="27"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="128" height="128" fill="url(#bg)"/>
    <circle cx="108" cy="16" r="52" fill="url(#shine)"/>

    <!-- Destellos de confeti, en tonos apagados -->
    <g opacity="0.75">
      <rect x="16" y="18" width="7" height="3" rx="1.5" fill="#9FCBB8" transform="rotate(-28 16 18)"/>
      <rect x="102" y="40" width="7" height="3" rx="1.5" fill="#E3CB8C" transform="rotate(24 102 40)"/>
      <rect x="24" y="52" width="6" height="3" rx="1.5" fill="#D9A8BE" transform="rotate(14 24 52)"/>
      <rect x="98" y="74" width="6" height="3" rx="1.5" fill="#9FCBB8" transform="rotate(-18 98 74)"/>
      <circle cx="20" cy="38" r="2.2" fill="#FFFFFF" opacity="0.5"/>
      <circle cx="110" cy="58" r="2.2" fill="#FFFFFF" opacity="0.45"/>
    </g>

    <!-- Arco de meta -->
    <path d="M13 94 A51 51 0 0 1 115 94" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>
    <path d="M13 94 A51 51 0 0 1 115 94" fill="none" stroke="#F1E4C2" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

    <!-- Bandera a cuadros -->
    <g transform="translate(40 28) rotate(-6 24 8)">
      <rect x="0" y="0" width="48" height="16" rx="3" fill="#2A2A3A"/>
      <g fill="#E9E6DE">
        <rect x="0" y="0" width="8" height="8"/>
        <rect x="16" y="0" width="8" height="8"/>
        <rect x="32" y="0" width="8" height="8"/>
        <rect x="8" y="8" width="8" height="8"/>
        <rect x="24" y="8" width="8" height="8"/>
        <rect x="40" y="8" width="8" height="8"/>
      </g>
      <rect x="0" y="0" width="48" height="16" rx="3" fill="none" stroke="#D9BE7E" stroke-width="1.5"/>
    </g>

    <!-- Corredor: cuerpo, brazos y piernas -->
    <ellipse cx="64" cy="116" rx="30" ry="6" fill="#22303F" opacity="0.35"/>
    <rect x="47" y="98" width="12" height="18" rx="6" fill="#CB9A5E" stroke="#9C7340" stroke-width="2"/>
    <rect x="69" y="98" width="12" height="18" rx="6" fill="#CB9A5E" stroke="#9C7340" stroke-width="2"/>
    <path d="M40 76 q-11 9 -8 20" fill="none" stroke="url(#body)" stroke-width="9" stroke-linecap="round"/>
    <path d="M88 76 q11 9 8 20" fill="none" stroke="url(#body)" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="64" cy="72" rx="27" ry="31" fill="url(#body)" stroke="#9C7340" stroke-width="2.5"/>
    <ellipse cx="54" cy="55" rx="10" ry="13" fill="#FFF4D9" opacity="0.3"/>

    <!-- Cara -->
    <ellipse cx="55" cy="70" rx="4.3" ry="5.6" fill="#25303D"/>
    <ellipse cx="73" cy="70" rx="4.3" ry="5.6" fill="#25303D"/>
    <circle cx="56.5" cy="68" r="1.4" fill="#F4F0E6"/>
    <circle cx="74.5" cy="68" r="1.4" fill="#F4F0E6"/>
    <circle cx="46" cy="82" r="5" fill="#CE8E9C" opacity="0.35"/>
    <circle cx="82" cy="82" r="5" fill="#CE8E9C" opacity="0.35"/>
    <path d="M56 83 q8 8 16 0" fill="none" stroke="#25303D" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Corona -->
    <path d="M43 45 L49 32 L57 42 L64 28 L71 42 L79 32 L85 45 Z" fill="url(#gold)" stroke="#8E6A2E" stroke-width="2" stroke-linejoin="round"/>
    <rect x="43" y="44" width="42" height="6" rx="3" fill="#DDBB6B" stroke="#8E6A2E" stroke-width="2"/>
    <circle cx="64" cy="34" r="2.4" fill="#F4E7C4"/>

    <!-- Suelo de meta -->
    <g transform="translate(0 106)">
      <g fill="#E9E6DE" opacity="0.85">
        <rect x="0" y="0" width="8" height="8"/><rect x="16" y="0" width="8" height="8"/>
        <rect x="32" y="0" width="8" height="8"/><rect x="48" y="0" width="8" height="8"/>
        <rect x="64" y="0" width="8" height="8"/><rect x="80" y="0" width="8" height="8"/>
        <rect x="96" y="0" width="8" height="8"/><rect x="112" y="0" width="8" height="8"/>
        <rect x="8" y="8" width="8" height="8"/><rect x="24" y="8" width="8" height="8"/>
        <rect x="40" y="8" width="8" height="8"/><rect x="56" y="8" width="8" height="8"/>
        <rect x="72" y="8" width="8" height="8"/><rect x="88" y="8" width="8" height="8"/>
        <rect x="104" y="8" width="8" height="8"/><rect x="120" y="8" width="8" height="8"/>
      </g>
      <rect x="0" y="0" width="128" height="16" fill="none" stroke="#25303D" stroke-width="2" opacity="0.4"/>
    </g>
  </g>
</svg>
