<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5F9E"/>
      <stop offset="0.55" stop-color="#B44DFF"/>
      <stop offset="1" stop-color="#4C6BFF"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE45C"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#FFEF7A"/>
      <stop offset="0.6" stop-color="#FFD23F"/>
      <stop offset="1" stop-color="#FF9E1B"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="128" height="128" rx="27"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="128" height="128" fill="url(#bg)"/>
    <circle cx="108" cy="16" r="52" fill="url(#shine)"/>

    <!-- Destellos de confeti -->
    <g opacity="0.9">
      <rect x="16" y="18" width="7" height="3" rx="1.5" fill="#8EF7D1" transform="rotate(-28 16 18)"/>
      <rect x="102" y="40" width="7" height="3" rx="1.5" fill="#FFEF7A" transform="rotate(24 102 40)"/>
      <rect x="24" y="52" width="6" height="3" rx="1.5" fill="#FFB3E6" transform="rotate(14 24 52)"/>
      <rect x="98" y="74" width="6" height="3" rx="1.5" fill="#8EF7D1" transform="rotate(-18 98 74)"/>
      <circle cx="20" cy="38" r="2.2" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="110" cy="58" r="2.2" fill="#FFFFFF" opacity="0.7"/>
    </g>

    <!-- Arco de meta -->
    <path d="M13 94 A51 51 0 0 1 115 94" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>
    <path d="M13 94 A51 51 0 0 1 115 94" fill="none" stroke="#FFF6C9" stroke-width="2" stroke-linecap="round" opacity="0.65"/>

    <!-- Bandera a cuadros -->
    <g transform="translate(40 28) rotate(-6 24 8)">
      <rect x="0" y="0" width="48" height="16" rx="3" fill="#1B1233"/>
      <g fill="#FFFFFF">
        <rect x="0" y="0" width="8" height="8"/>
        <rect x="16" y="0" width="8" height="8"/>
        <rect x="32" y="0" width="8" height="8"/>
        <rect x="8" y="8" width="8" height="8"/>
        <rect x="24" y="8" width="8" height="8"/>
        <rect x="40" y="8" width="8" height="8"/>
      </g>
      <rect x="0" y="0" width="48" height="16" rx="3" fill="none" stroke="#FFE45C" stroke-width="1.5"/>
    </g>

    <!-- Corredor: cuerpo, brazos y piernas -->
    <ellipse cx="64" cy="116" rx="30" ry="6" fill="#2B1550" opacity="0.35"/>
    <rect x="47" y="98" width="12" height="18" rx="6" fill="#FF9F1C" stroke="#B8730B" stroke-width="2"/>
    <rect x="69" y="98" width="12" height="18" rx="6" fill="#FF9F1C" stroke="#B8730B" stroke-width="2"/>
    <path d="M40 76 q-11 9 -8 20" fill="none" stroke="url(#body)" stroke-width="9" stroke-linecap="round"/>
    <path d="M88 76 q11 9 8 20" fill="none" stroke="url(#body)" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="64" cy="72" rx="27" ry="31" fill="url(#body)" stroke="#B8730B" stroke-width="2.5"/>
    <ellipse cx="54" cy="55" rx="10" ry="13" fill="#FFF8C9" opacity="0.45"/>

    <!-- Cara -->
    <ellipse cx="55" cy="70" rx="4.3" ry="5.6" fill="#26163F"/>
    <ellipse cx="73" cy="70" rx="4.3" ry="5.6" fill="#26163F"/>
    <circle cx="56.5" cy="68" r="1.4" fill="#FFFFFF"/>
    <circle cx="74.5" cy="68" r="1.4" fill="#FFFFFF"/>
    <circle cx="46" cy="82" r="5" fill="#FF6FA5" opacity="0.45"/>
    <circle cx="82" cy="82" r="5" fill="#FF6FA5" opacity="0.45"/>
    <path d="M56 83 q8 8 16 0" fill="none" stroke="#26163F" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Corona -->
    <path d="M43 45 L49 32 L57 42 L64 28 L71 42 L79 32 L85 45 Z" fill="url(#gold)" stroke="#A35B00" stroke-width="2" stroke-linejoin="round"/>
    <rect x="43" y="44" width="42" height="6" rx="3" fill="#FFC93C" stroke="#A35B00" stroke-width="2"/>
    <circle cx="64" cy="34" r="2.4" fill="#FFF6C9"/>

    <!-- Suelo de meta -->
    <g transform="translate(0 106)">
      <g fill="#FFFFFF" opacity="0.95">
        <rect x="0" y="0" width="8" height="8"/><rect x="16" y="0" width="8" height="8"/>
        <rect x="32" y="0" width="8" height="8"/><rect x="48" y="0" width="8" height="8"/>
        <rect x="64" y="0" width="8" height="8"/><rect x="80" y="0" width="8" height="8"/>
        <rect x="96" y="0" width="8" height="8"/><rect x="112" y="0" width="8" height="8"/>
        <rect x="8" y="8" width="8" height="8"/><rect x="24" y="8" width="8" height="8"/>
        <rect x="40" y="8" width="8" height="8"/><rect x="56" y="8" width="8" height="8"/>
        <rect x="72" y="8" width="8" height="8"/><rect x="88" y="8" width="8" height="8"/>
        <rect x="104" y="8" width="8" height="8"/><rect x="120" y="8" width="8" height="8"/>
      </g>
      <rect x="0" y="0" width="128" height="16" fill="none" stroke="#26163F" stroke-width="2" opacity="0.5"/>
    </g>
  </g>
</svg>
