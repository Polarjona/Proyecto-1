name: tests

"on":
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  # Suite obligatoria: tiene que pasar siempre y en menos de 20 minutos.
  suite:
    name: Suite headless
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Tests headless
        # Con `bash` el bit ejecutable no depende de cómo se clonó el repo.
        # `run_tests.sh` corta cada test por tiempo, así que un cuelgue falla.
        run: cd proyecto && bash tools/run_tests.sh

      - name: Guardar los logs de los tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-suite
          path: proyecto/tools/test-logs/
          if-no-files-found: ignore

  # Los tests largos van en su propio job: no alargan la suite y no pueden
  # quedarse fuera de la CI sin que se note (si fallan, la CI está en rojo).
  largos:
    name: Tests largos (bots)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Tests largos de bots
        run: cd proyecto && bash tools/run_tests.sh --long

      - name: Guardar los logs de los tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-largos
          path: proyecto/tools/test-logs/
          if-no-files-found: ignore
